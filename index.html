<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ランダム常用漢字</title>
  <link rel="stylesheet" href="style.css">
  <script src="常用漢字表.js"></script>
  <script src="script.js" defer></script>
  <link rel="icon" type="image/png" href="favicon/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="favicon/favicon.svg" />
  <link rel="shortcut icon" href="favicon/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="ランダム常用漢字" />
  <link rel="manifest" href="favicon/site.webmanifest" />
</head>
<body>
  <main>
    <h1>ランダム常用漢字</h1>
    <div id="kanji" data-state="loading" role="status" aria-live="polite">読み込み中…</div>
    <div class="controls">
      <label for="count-select">表示する文字数</label>
      <span class="select-wrap"><select id="count-select" disabled>
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
        <option value="6">6</option>
        <option value="7">7</option>
        <option value="8">8</option>
        <option value="9">9</option>
        <option value="10">10</option>
      </select></span>
      <button id="draw-button" type="button" disabled>ひく</button>
    </div>
  </main>
</body>
</html>
